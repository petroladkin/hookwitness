name: Feature
description: Something Hookwitness should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to test or find out, and where does Hookwitness stop you?
    validations:
      required: true
  - type: input
    id: sender
    attributes:
      label: The sender or tool
      description: The service that sends the webhooks, or the tool that talks to Hookwitness.
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The workaround you use today, if any.
