name: ci

on:
  pull_request:
  push:
    branches: [dev, main]
    # Versions only: v1.2.3 and v1.2.3-rc.4.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request's commits, for the sign-off check
      # Every commit of a pull request signed off by its author (DCO).
      - if: github.event_name == 'pull_request'
        run: scripts/dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make js-test
      # Every shell example of the README and docs/ against a fresh build,
      # with the outputs the text promises.
      - run: |
          curl --version | head -1; jq --version; openssl version
          make docs-check

  # The amd64 image and the scenarios users follow, on every PR and push;
  # read-only.
  image:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
      - id: ver
        # The version the build reports: the tag for a release, "edge" for
        # the image built from dev, otherwise what git describe says.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$GITHUB_REF_NAME
            if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "::error::$v is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)"; exit 1
            fi
          elif [ "$GITHUB_REF" = refs/heads/dev ]; then v=edge
          else v=$(git describe --tags --dirty 2>/dev/null || echo dev); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hookwitness:smoke
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke.sh hookwitness:smoke
      - run: scripts/api-smoke.sh --image hookwitness:smoke

  # The release archives on every PR and push: built twice, compared byte
  # for byte (reproducible), checked against SHA256SUMS and run; read-only.
  dist:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          make dist
          mv dist dist.first
          make dist
          for f in dist/*; do cmp "$f" "dist.first/${f#dist/}"; done
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir run && tar -xzf dist/hookwitness_*_linux_amd64.tar.gz -C run --strip-components 1
          run/hookwitness version

  # Both platforms pushed to GHCR, from dev (:edge) and release tags only;
  # the one job that may write packages and attestations.
  publish:
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A release candidate gets only its own tag: {{major}}.{{minor}}
          # and latest skip prereleases.
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Attestations are not put into the image index (no unknown/unknown
      # entry): they are attached below as separate referrers.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.image.outputs.version }}
            COMMIT=${{ needs.image.outputs.commit }}
          provenance: false
          sbom: false
          cache-from: type=gha
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The release archives of a release tag on a draft Release (a prerelease
  # for an rc), attested; the release step writes the notes and publishes
  # it. The one job that may write contents, and only on a release tag.
  binaries:
    needs: [image, dist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make dist VERSION="$VERSION" COMMIT="$COMMIT"
        env:
          VERSION: ${{ needs.image.outputs.version }}
          COMMIT: ${{ needs.image.outputs.commit }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # A Release already published is never changed; a draft left by an
      # earlier run of this tag gets the assets again.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')
          case "$draft" in
            false) echo "::error::the Release of $TAG is already published; its assets are left as they are"; exit 1 ;;
            true) gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY" ;;
            *)
              pre=
              case "$TAG" in *-rc.*) pre=--prerelease ;; esac
              gh release create "$TAG" --draft $pre --verify-tag --title "$TAG" \
                --notes "Draft made by CI: the release step writes the notes and publishes it." \
                -R "$GITHUB_REPOSITORY" dist/*.tar.gz dist/SHA256SUMS ;;
          esac
